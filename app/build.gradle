plugins { id 'com.android.application' }
android {
    namespace 'com.v7.quantumfast'
    compileSdk 34
    defaultConfig {
        applicationId "com.v7.quantumfast"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "2.3-GMAIL-OK"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    packaging { resources { excludes += ["META-INF/INDEX.LIST","META-INF/DEPENDENCIES","META-INF/LICENSE","META-INF/LICENSE.txt","META-INF/NOTICE","META-INF/NOTICE.txt","META-INF/*.kotlin_module"] } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'com.google.api-client:google-api-client:2.0.0'
    implementation 'com.google.api-client:google-api-client-android:2.0.0'
    implementation 'com.google.http-client:google-http-client:1.43.3'
    implementation 'com.google.http-client:google-http-client-gson:1.43.3'
    implementation 'com.google.oauth-client:google-oauth-client:1.34.1'
    implementation 'com.google.apis:google-api-services-gmail:v1-rev20240520-2.0.0'
}
