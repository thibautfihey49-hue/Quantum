plugins { id 'com.android.application' }
android {
    namespace 'com.v7.quantumfast'
    compileSdk 34
    defaultConfig {
        applicationId "com.v7.quantumfast"
        minSdk 26
        targetSdk 34
        versionCode 100
        versionName "fix9"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
