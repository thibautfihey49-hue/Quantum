plugins { id 'com.android.application' }
android {
    namespace 'com.v7.quantumfast'
    compileSdk 34
    defaultConfig { applicationId "com.v7.quantumfast"; minSdk 24; targetSdk 34; versionCode 6; versionName "2.4-REST-GMAIL" }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    packaging { resources { excludes += ["META-INF/INDEX.LIST","META-INF/DEPENDENCIES","META-INF/LICENSE","META-INF/LICENSE.txt","META-INF/NOTICE","META-INF/NOTICE.txt","META-INF/*.kotlin_module"] } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
}
